<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
    <style>
        html, body {
            margin: 0;
            min-height: 100%;
        }
        .paper {
            background-color: #008000;
            background-image: linear-gradient(to top, #002200, #4caf50);
            background-attachment: fixed;
            color: #FFFFFF;
            font-size: 20px;
            line-height: 1.5;
            padding: 20px;
        }
        .gradient-text {
            background-image: linear-gradient(90deg, #ffdd00, #ff6a00, #ffdd00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        a {
            color: #ffdd00;
        }
        a:hover {
            color: #ffffff;
        }
    </style>
        <title>Черепашки-ниндзя</title>
    </head>
    <body class="paper">
        <h1 class="gradient-text">ЛЕО</h1>
        <p></p>
        <img src="https://pngimg.com/uploads/ninja_turtles/ninja_turtles_PNG62.png">
    </body>
</html>
